name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Summary
      description: A clear one-line description of the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Smallest test or command that triggers the bug.
      render: shell
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Output of `ceedless doctor` and `ceedless version`.
      render: shell
    validations:
      required: true
